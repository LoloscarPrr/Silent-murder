name: Silent Killer - Android baseline

on:
  workflow_dispatch:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: silent-killer-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified_android:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Godot 4.3 official Android export tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          if [ -f /root/.config/godot/editor_settings-4.3.tres ]; then
            cp -a /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/editor_settings-4.3.tres"
          else
            cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          fi
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s /root/debug.keystore
          command -v keytool
          command -v godot
          echo "Android signing fingerprint of the CI debug keystore:"
          keytool -list -v -keystore /root/debug.keystore -alias androiddebugkey -storepass android -keypass android \
            | grep -F 'SHA256:' | head -1
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
      - name: Stage actual mission and every original GDScript, excluding old Blender source candidates
        run: |
          set -euo pipefail
          stage=/tmp/silent_killer_fase11
          mkdir -p "$stage/scripts" "$stage/scenes" "$stage/tests" \
            "$stage/character_assets/el_cuervo/fase9_animaciones"
          cp scripts/*.gd "$stage/scripts/"
          cp scenes/*.tscn "$stage/scenes/"
          cp tests/*.gd tests/*.tscn "$stage/tests/"
          cp project.godot "$stage/project.godot"
          cp character_assets/el_cuervo/fase9_animaciones/El_Cuervo_Fase9_Walk_Aim_REVISION.glb \
             "$stage/character_assets/el_cuervo/fase9_animaciones/"
          test -s "$stage/character_assets/el_cuervo/fase9_animaciones/El_Cuervo_Fase9_Walk_Aim_REVISION.glb"
          grep -F 'run/main_scene="res://scenes/main.tscn"' "$stage/project.godot"
          echo "Same production game and GLB, with irrelevant source Blender files excluded from import."
      - name: Import GLB and compile all scripts
        run: |
          set -euo pipefail
          godot --headless --path /tmp/silent_killer_fase11 \
            --editor --import --quit > /tmp/cuervo_fase11_import.log 2>&1 || {
              cat /tmp/cuervo_fase11_import.log
              exit 1
            }
          tail -60 /tmp/cuervo_fase11_import.log
      - name: Run actual mission with real skinned Cuervo rig and old gameplay
        run: |
          set -euo pipefail
          timeout 100s godot --headless \
            --path /tmp/silent_killer_fase11 \
            --script res://tests/cuervo_gameplay_integration_test.gd \
            > /tmp/cuervo_fase11_mission.log 2>&1 || {
              cat /tmp/cuervo_fase11_mission.log
              exit 1
            }
          cat /tmp/cuervo_fase11_mission.log
          grep -F 'CUERVO_FASE11_PASS' /tmp/cuervo_fase11_mission.log
          grep -F 'CUERVO_FASE11_MISSION_PASS' /tmp/cuervo_fase11_mission.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|CUERVO_FASE11_FAILED' /tmp/cuervo_fase11_mission.log; then
            exit 1
          fi
      - name: Run existing pistol, multitouch, melee, guard, stealth and mission regressions
        run: |
          set -euo pipefail
          godot=$(command -v godot)
          stage=/tmp/silent_killer_fase11
          while IFS=':' read -r test marker; do
            echo "VERIFYING $test: $marker"
            timeout 90s "$godot" --headless --path "$stage" --quit-after 1800 \
              "res://tests/$test.tscn" > "/tmp/fase11_$test.log" 2>&1 || {
                tail -80 "/tmp/fase11_$test.log"
                exit 1
              }
            grep -F "$marker" "/tmp/fase11_$test.log" || {
              tail -80 "/tmp/fase11_$test.log"
              exit 1
            }
            if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Invalid assignment|Assertion failed' "/tmp/fase11_$test.log"; then
              echo "Gameplay regression failed for $test"
              exit 1
            fi
          done <<'TESTS'
          multitouch_test:MULTITOUCH_TEST_PASS
          combat_test:COMBAT_TEST_PASS
          melee_test:MELEE_TEST_PASS
          guard_ai_test:GUARD_AI_TEST_PASS
          mission_test:MISSION_TEST_PASS
          mission_failure_test:MISSION_FAILURE_TEST_PASS
          quality_fix_test:QUALITY_FIX_TEST_PASS
          shot_cover_test:SHOT_COVER_TEST_PASS
          navigation_test:NAVIGATION_TEST_PASS
          touch_lifecycle_test:TOUCH_LIFECYCLE_TEST_PASS
          ammo_boundary_test:AMMO_BOUNDARY_TEST_PASS
          TESTS
      - name: Verify real mission reload after defeat and victory
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path /tmp/silent_killer_fase11 \
            --script res://tests/mission_restart_test.gd > /tmp/fase11_mission_restart.log 2>&1 || {
              cat /tmp/fase11_mission_restart.log
              exit 1
            }
          grep -F 'MISSION_RESTART_TEST_PASS' /tmp/fase11_mission_restart.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Invalid assignment|Assertion failed|MISSION_RESTART_FAILED' /tmp/fase11_mission_restart.log; then
            cat /tmp/fase11_mission_restart.log
            exit 1
          fi
      - name: Stage only playable project and verified Cuervo model
        shell: bash
        run: |
          set -euo pipefail
          p=build/cuervo_android_game
          mkdir -p "$p/scripts" "$p/scenes" "$p/character_assets/el_cuervo/fase9_animaciones"
          cp scripts/*.gd "$p/scripts/"
          cp scenes/main.tscn "$p/scenes/"
          cp project.godot export_presets.cfg "$p/"
          cp character_assets/el_cuervo/fase9_animaciones/El_Cuervo_Fase9_Walk_Aim_REVISION.glb \
            "$p/character_assets/el_cuervo/fase9_animaciones/"
          grep -F 'package/unique_name="com.loloscarprr.silentmurder"' "$p/export_presets.cfg"
          grep -F 'version/code=14' "$p/export_presets.cfg"
          test -s "$p/character_assets/el_cuervo/fase9_animaciones/El_Cuervo_Fase9_Walk_Aim_REVISION.glb"
          echo "APK staging preserves current game main scene, original scripts, package and original debug signing."
      - name: Import real CC0 rig with two clips
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path build/cuervo_android_game --editor --import --quit \
            > /tmp/cuervo11_android_import.log 2>&1 || {
              tail -80 /tmp/cuervo11_android_import.log
              exit 1
            }
          tail -35 /tmp/cuervo11_android_import.log
      - name: Android export of the actual Silent Killer mission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/apk
          godot --headless --path build/cuervo_android_game --export-debug \
             "Android" "$GITHUB_WORKSPACE/build/apk/SilentKiller_v0.7.3_debug.apk" \
             > /tmp/cuervo11_android_export.log 2>&1 || {
              tail -100 /tmp/cuervo11_android_export.log
              exit 1
            }
          test -s build/apk/SilentKiller_v0.7.3_debug.apk
          tail -50 /tmp/cuervo11_android_export.log
      - name: Verify APK metadata, package, version code and arm64
        shell: bash
        run: |
          set -euo pipefail
          file=build/apk/SilentKiller_v0.7.3_debug.apk
          unzip -t "$file" | tail -2
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$file" > /tmp/cuervo11_badging.txt
          grep -F "name='com.loloscarprr.silentmurder'" /tmp/cuervo11_badging.txt
          grep -F "versionCode='14'" /tmp/cuervo11_badging.txt
          grep -F "versionName='0.7.3'" /tmp/cuervo11_badging.txt
          grep -F 'arm64-v8a' /tmp/cuervo11_badging.txt
          ls -lh "$file"
          # Package name and signing must remain compatible with the existing
          # debug installation; on-phone replacement still depends on the
          # previously installed APK using the very same signing key.
      - name: Record APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/apk
          apk=SilentKiller_v0.7.3_debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signing.txt
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SilentKiller-v0.7.3-Android-debug
          path: build/apk/SilentKiller_v0.7.3_debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SilentKiller-baseline-QA
          path: |
            /tmp/fase11_*.log
            /tmp/cuervo_fase11_*.log
            /tmp/cuervo11_*.log
            /tmp/cuervo11_badging.txt
            build/apk/signing.txt
            build/apk/SHA256SUMS.txt
          retention-days: 30
