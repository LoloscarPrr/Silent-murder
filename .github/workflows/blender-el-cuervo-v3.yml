name: 3D Assets - El Cuervo 3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/blender/build_el_cuervo_v3.py'
      - '.github/workflows/blender-el-cuervo-v3.yml'

permissions:
  contents: read

concurrency:
  group: el-cuervo-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-three-looks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and virtual graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1-mesa-dri libglx-mesa0
          blender --version | head -3

      - name: Generate real Blender models A B C
        shell: bash
        run: |
          set -euo pipefail
          for style in A B C; do
            mkdir -p "out/v3/$style"
            xvfb-run -a -s "-screen 0 1280x1024x24" blender --background --factory-startup --python tools/blender/build_el_cuervo_v3.py -- --variant "$style" --output "out/v3/$style" 2>&1 | tee "out/v3/$style/blender.log"
            grep -Fq "EL_CUERVO_V3_EXPORT_OK $style" "out/v3/$style/blender.log"
            test -s "out/v3/$style/El_Cuervo_3_$style.glb"
            test -s "out/v3/$style/El_Cuervo_3_$style.blend"
            test -s "out/v3/$style/El_Cuervo_3_$style"_"01_Frente.png"
            test -s "out/v3/$style/El_Cuervo_3_$style"_"02_TresCuartos.png"
          done

      - name: Validate all three GLB files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, pathlib
          for style in "ABC":
              path=pathlib.Path(f"out/v3/{style}/El_Cuervo_3_{style}.glb")
              data=path.read_bytes()
              magic, version, length=struct.unpack_from("<4sII",data,0)
              assert magic == b"glTF" and version == 2 and length == len(data)
              length_json, type_json=struct.unpack_from("<II",data,12)
              assert type_json == 0x4e4f534a
              model=json.loads(data[20:20+length_json].decode("utf-8"))
              assert len(model.get("meshes",[])) >= 55
              assert len(model.get("skins",[])) >= 1
              assert len(model["skins"][0]["joints"]) >= 15
              assert len(model.get("materials",[])) >= 10
              print(f"EL_CUERVO_3_{style}_PASS:",len(model["meshes"]),"meshes,",len(model["skins"][0]["joints"]),"bones")
          PY

      - name: Upload 3D models + editor projects + phone previews
        uses: actions/upload-artifact@v4
        with:
          name: SilentKiller-ElCuervo-3D-3Variants
          path: |
            out/v3/*/*.glb
            out/v3/*/*.blend
            out/v3/*/*.png
          retention-days: 30
          if-no-files-found: error
