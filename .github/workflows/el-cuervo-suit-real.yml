name: El Cuervo - vestuario real CC0 MakeHuman (reemplazo)

on:
  push:
    branches:
      - feature/el-cuervo-base-humana-v1
    paths:
      - 'tools/el_cuervo/fase3_real_suits.py'
      - '.github/workflows/el-cuervo-suit-real.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: el-cuervo-ropa-real-suits-v1
  cancel-in-progress: true

jobs:
  authentic_clothing:
    name: Blender 4.3 ropa MakeHuman autentica - dos variantes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/el-cuervo-base-humana-v1
          persist-credentials: true
      - name: Preparar Blender 4.3 oficial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils curl unzip libgl1 libegl1 libx11-6 libxrender1 libxi6 libxkbcommon0 libxxf86vm1 libsm6 libxfixes3 libgl1-mesa-dri
          curl -fL --retry 3 --connect-timeout 20 'https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender-4.3
          tar -xf /tmp/blender.tar.xz -C /tmp/blender-4.3 --strip-components=1
          /tmp/blender-4.3/blender -b --factory-startup --python-expr 'import bpy; assert bpy.app.version[:2]==(4,3)'
      - name: Descargar trajes originales CC0 de MakeHuman Community
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 'https://files2.makehumancommunity.org/asset_packs/suits01/suits01_cc0.zip' -o /tmp/suits01_cc0.zip
          python3 - <<'PY'
          import zipfile,os,hashlib
          p='/tmp/suits01_cc0.zip'
          assert zipfile.is_zipfile(p)
          with open(p,'rb') as f: h=hashlib.sha256(f.read()).hexdigest()
          assert h=='2b1d8676f3863b188e9eea98c1d8f234543d54c440e791d92b819f8ee1861f19',(h,'Fuente alterada respecto a inventario')
          print("AUTHOR_CC0_ASSET_VERIFIED",h,os.path.getsize(p))
          PY
      - name: Exigir anatomia base v1 verificada
        run: |
          test -s character_assets/el_cuervo/fase1/El_Cuervo_Base_Humana_v1.blend
          test -s character_assets/el_cuervo/fase1/El_Cuervo_Verificacion.json
      - name: Adaptar mallas reales y generar ocho renders
        run: |
          mkdir -p character_assets/el_cuervo/fase3_prenda_real
          /tmp/blender-4.3/blender -b --factory-startup --python-exit-code 1 \
            --python tools/el_cuervo/fase3_real_suits.py -- \
            --blend character_assets/el_cuervo/fase1/El_Cuervo_Base_Humana_v1.blend \
            --zip /tmp/suits01_cc0.zip \
            --out character_assets/el_cuervo/fase3_prenda_real
      - name: Reimportar ambos GLB en Blender y verificar esqueleto y prendas reales
        run: |
          /tmp/blender-4.3/blender -b --factory-startup --python-exit-code 1 --python-expr '
          import bpy,os,json
          d="character_assets/el_cuervo/fase3_prenda_real"
          a=json.load(open(os.path.join(d,"AUDITORIA_TRAJES_REALES.json")))
          assert len(a["candidates"])==2
          for c in a["candidates"]:
              bpy.ops.wm.read_factory_settings(use_empty=True)
              bpy.ops.import_scene.gltf(filepath=os.path.join(d,c["glb"]))
              m=[o for o in bpy.context.scene.objects if o.type=="MESH" and o.name.startswith("CC0_toigo_male")]
              b=[o for o in bpy.context.scene.objects if o.type=="ARMATURE"]
              assert m and b and sum(len(x.data.bones) for x in b)>=100,(c["name"],m,b)
              assert all(any(mod.type=="ARMATURE" for mod in o.modifiers) for o in m),c
              print("REAL_CC0_MESH_GLTF_IMPORTED",c["name"],len(m))
          '
      - name: Validar ambas variantes en Godot 4.3 sin tocar el juego
        run: |
          curl -fL --retry 3 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          for kind in toigo_male_suit_3 toigo_male_suit_tie_and_jacket; do
            root="/tmp/cuervo_godot_$kind"
            mkdir -p "$root"
            file="El_Cuervo_$kind""_TRAJE_REAL_WIP.glb"
            cp "character_assets/el_cuervo/fase3_prenda_real/$file" "$root/"
            printf '[application]\nconfig/name="Cuervo CC0 Wardrobe QA"\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$root/project.godot"
            sed "s/El_Cuervo_Base_Humana_v1.glb/$file/" tools/el_cuervo/verify_godot.gd > "$root/verify_godot.gd"
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path "$root" --editor --import --quit
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path "$root" --script res://verify_godot.gd
          done
          python3 - <<'PY'
          import json
          p='character_assets/el_cuervo/fase3_prenda_real/AUDITORIA_TRAJES_REALES.json'
          v=json.load(open(p))
          v['godot_4_3_both_variants_import_verified']=True
          json.dump(v,open(p,'w'),ensure_ascii=False,indent=2)
          PY
      - name: Documentar origen y limite de aprobacion
        run: |
          cat > character_assets/el_cuervo/fase3_prenda_real/LEEME.md <<'EOF'
          # El Cuervo - reemplazo real del traje rechazado
          Fuente: Margaret Toigo, MakeHuman Community, Suits 01, CC0.
          https://static.makehumancommunity.org/assets/assetpacks/suits01.html
          https://files2.makehumancommunity.org/asset_packs/suits01/suits01_cc0.zip

          Trajes originales de topologia diseñada por artista 3D; NO se
          construyeron a partir de cilindros, cubos ni un render IA.
          Se ajustaron a escala y posicion del humano CC0 El Cuervo.
          Los pesos al rig se estimaron automaticamente, NO son aprobados
          aun. Revisar la anatomia, mangas, cuello, manos, intersecciones
          y deformacion antes de fusionar o usar en Android.
          Los renders son renderizados directamente por Blender.
          Se conserva el cuerpo anterior y los archivos de la Fase 3
          rechazada como trazabilidad; este prototipo NO se integro a main.
          EOF
      - name: Guardar entregables en rama de produccion
        if: github.event_name == 'push'
        run: |
          git config user.name 'El Cuervo Production Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character_assets/el_cuervo/fase3_prenda_real
          if ! git diff --cached --quiet; then
            git commit -m 'assets(character): genuine authored MakeHuman CC0 tailored suit WIP alternatives'
            git pull --rebase origin feature/el-cuervo-base-humana-v1
            git push origin HEAD:feature/el-cuervo-base-humana-v1
          fi
      - name: Paquete de vistas y archivos editables
        uses: actions/upload-artifact@v4
        with:
          name: El_Cuervo_Trajes_CC0_Reales
          path: character_assets/el_cuervo/fase3_prenda_real
          if-no-files-found: error
          retention-days: 30
